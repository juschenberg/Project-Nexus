{% extends "layout.html" %}
{% block content %}
<section class="card">
  <h2>Mitarbeiter anlegen</h2>
  <form method="post" class="form-grid">
    <label>Name
      <input type="text" name="name" placeholder="z.B. Maria Schmidt" required />
    </label>
    <button type="submit">Anlegen</button>
  </form>
</section>

<section class="card">
  <h2>Mitarbeiter suchen</h2>
  <form method="get" class="form-grid">
    <label>Suche
      <input type="text" name="q" value="{{ query }}" placeholder="Name oder ID" />
    </label>
    <button type="submit">Suchen</button>
  </form>
</section>

<section class="card">
  <h2>Ergebnisliste</h2>
  {% if employees %}
    <div class="table">
      <div class="row header">
        <div>Name</div>
        <div>ID</div>
        <div>Aktion</div>
      </div>
      {% for emp in employees %}
        <div class="row">
          <div>{{ emp['name'] }}</div>
          <div class="mono">{{ emp['id'] }}</div>
          <div>
            <a class="button-link" href="{{ url_for('edit_prefs', emp_id=emp['id']) }}">Wünsche bearbeiten</a>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p>Keine Mitarbeiter gefunden.</p>
  {% endif %}
</section>
{% endblock %}
